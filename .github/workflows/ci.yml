# Every push and pull request: install, run the tests and build (types included). If it fails, GitHub shows a red
# cross on the commit, so a broken change is noticed before trusting what Vercel published.
name: CI
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
