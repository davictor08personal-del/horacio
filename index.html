<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw under the notch; safe-area padding in CSS keeps content clear of it -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Horacio</title>
    <meta name="theme-color" content="#f3f5f9" />
    <!-- Light or dark before the first paint, so it never flashes. Same rule as src/theme.ts: the user's choice, else the system's. -->
    <script>
      (function () {
        var pref = 'system'
        try { pref = localStorage.getItem('horacio-theme') || 'system' } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name=theme-color]').content = dark ? '#121212' : '#f3f5f9'
      })()
    </script>
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <!-- iOS: icon, name and full-screen mode when added to the home screen -->
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Horacio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
