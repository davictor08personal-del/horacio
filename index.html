<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw under the notch; safe-area padding in CSS keeps content clear of it -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cuadre</title>
    <meta name="theme-color" content="#f3f5f9" />
    <!-- Light or dark before the first paint, so it never flashes (a blocking script on purpose; same rule as src/theme.ts).
         It's a file, not inline, so the Content-Security-Policy in vercel.json can forbid inline scripts. -->
    <script src="/theme-init.js"></script>
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <!-- iOS: icon, name and full-screen mode when added to the home screen -->
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cuadre" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
